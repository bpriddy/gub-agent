# CI — ruff lint + pytest.
#
# The whole suite (unit + integration) is hermetic: integration tests run
# against a localhost MockGub server (tests/integration/conftest.py), so no
# credentials, GCP access, or live GUB backend is needed.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pyproject's requires-python = ">=3.11" is the source of truth; 3.12 is
      # just the newest supported (this repo deploys via adk deploy agent_engine,
      # no Dockerfile).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check gub_agent tests

      - name: Format check (ruff format)
        run: ruff format --check gub_agent tests

      - name: Tests (pytest)
        run: pytest
