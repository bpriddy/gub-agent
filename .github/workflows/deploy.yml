# Deploy — update the Vertex AI Agent Engine in place via the Python SDK
# (deployment/deploy_agent_engine.py; NOT Cloud Run, NOT Cloud Build — see
# README "Deploy"). Same engine id every time, so callers (the Chat bot,
# Agentspace/Gemini Enterprise) see no change.
#
# Why the SDK and not `adk deploy agent_engine`: the SDK deploy ships the
# CURRENT AdkApp template, whose stream_query accepts a per-call `run_config`
# — that's what lets the Chat bot request SSE token streaming (gub-gchat-bot
# issue #3). Streaming is opt-in per call; callers that don't pass run_config
# keep today's one-blob behavior.
#
# Auth is Workload Identity Federation (OIDC) — google-github-actions/auth
# writes ADC credentials, which the ADK/Vertex SDK picks up automatically.
#
# Pre-deploy reminder (manual, from the README): grep prompt/instruction
# strings for literal `{...}` — ADK's session-state injection KeyErrors on
# any brace that isn't a real state key, visible only in engine logs.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      description:
        description: What changed (stored as the engine revision description)
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-agent-engine
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      # Without AGENT_ENGINE_ID the SDK path would have to CREATE a brand-new
      # engine and nothing points at it. Refuse to run rather than fork the
      # deployment. AGENT_STAGING_BUCKET is new with the SDK deploy: it uploads
      # the pickled app + requirements through a GCS staging bucket (the old
      # CLI path didn't need one).
      - name: Refuse to create a new engine
        run: |
          if [ -z "${{ vars.AGENT_ENGINE_ID }}" ]; then
            echo "::error::AGENT_ENGINE_ID repository variable is not set — deploy would create a NEW Agent Engine instead of updating the existing one. See CI-CD.md."
            exit 1
          fi
          if [ -z "${{ vars.AGENT_STAGING_BUCKET }}" ]; then
            echo "::error::AGENT_STAGING_BUCKET repository variable is not set — the SDK deploy needs a gs:// staging bucket (see deployment/deploy_agent_engine.py)."
            exit 1
          fi

      - name: Install deploy dependencies
        run: pip install -e ".[deploy]"

      # deploy_agent_engine.py bakes deploy-dev.env (EMIT_THINKING=1) into the
      # engine, matching the previous --env_file convention. GCP_REGION controls
      # where the engine RESOURCE lives; model calls stay on the global endpoint
      # via config (see README "Model endpoint vs engine region").
      - name: Deploy to Vertex AI Agent Engine
        # The dispatch input is passed as an ENV VALUE, never interpolated into
        # the script text — otherwise a crafted `description` (workflow_dispatch
        # only needs repo write) would run as arbitrary shell in a job already
        # authenticated to GCP via WIF.
        env:
          DEPLOY_DESCRIPTION: ${{ github.event.inputs.description }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          AGENT_ENGINE_ID: ${{ vars.AGENT_ENGINE_ID }}
          AGENT_STAGING_BUCKET: ${{ vars.AGENT_STAGING_BUCKET }}
        run: |
          DESC="$DEPLOY_DESCRIPTION"
          [ -n "$DESC" ] || DESC="GitHub Actions deploy ${GITHUB_SHA::7}"
          python deployment/deploy_agent_engine.py --description "$DESC"
