# Deploy — update the Vertex AI Agent Engine in place via
# `adk deploy agent_engine` (NOT Cloud Run, NOT Cloud Build — see README
# "Deploy"). Same engine id every time, so callers (the Chat bot,
# Agentspace/Gemini Enterprise) see no change.
#
# Auth is Workload Identity Federation (OIDC) — google-github-actions/auth
# writes ADC credentials, which the ADK/Vertex SDK picks up automatically.
#
# Pre-deploy reminder (manual, from the README): grep prompt/instruction
# strings for literal `{...}` — ADK's session-state injection KeyErrors on
# any brace that isn't a real state key, visible only in engine logs.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      description:
        description: What changed (stored as the engine revision description)
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-agent-engine
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      # Without --agent_engine_id, adk deploy CREATES a brand-new engine and
      # nothing points at it. Refuse to run rather than fork the deployment.
      - name: Refuse to create a new engine
        run: |
          if [ -z "${{ vars.AGENT_ENGINE_ID }}" ]; then
            echo "::error::AGENT_ENGINE_ID repository variable is not set — deploy would create a NEW Agent Engine instead of updating the existing one. See CI-CD.md."
            exit 1
          fi

      - name: Install deploy dependencies
        run: pip install -e ".[deploy]"

      # --env_file bakes deploy-prod.env into the engine. The path is
      # ABSOLUTE on purpose: `adk deploy` chdir()s into its staging folder
      # BEFORE it reads --env_file (ADK 2.6.1 cli_deploy.py:1000 vs :1094), so
      # a relative path is looked up in the wrong directory and SILENTLY
      # skipped — which is how this engine ran for a month on config.py
      # defaults with an empty deploymentSpec. The verify step below is the
      # tripwire. --region controls where the engine RESOURCE lives; model
      # calls stay on the global endpoint via config (see README "Model
      # endpoint vs engine region").
      #
      # --extra_packages stages the repo-root services.py at /app/services.py
      # (with /app on PYTHONPATH); `adk api_server` imports it at start, before
      # it builds the agentengine:// session service. Without it the engine
      # silently runs ADK's stock session service whatever
      # SESSION_CLIENT_REUSE says. Absolute for the same reason as --env_file.
      - name: Deploy to Vertex AI Agent Engine
        # The dispatch input is passed as an ENV VALUE, never interpolated into
        # the script text — otherwise a crafted `description` (workflow_dispatch
        # only needs repo write) would run as arbitrary shell in a job already
        # authenticated to GCP via WIF.
        env:
          DEPLOY_DESCRIPTION: ${{ github.event.inputs.description }}
        run: |
          DESC="$DEPLOY_DESCRIPTION"
          [ -n "$DESC" ] || DESC="GitHub Actions deploy ${GITHUB_SHA::7}"
          adk deploy agent_engine \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --agent_engine_id="${{ vars.AGENT_ENGINE_ID }}" \
            --display_name="gub-agent" \
            --description="$DESC" \
            --env_file="$GITHUB_WORKSPACE/deploy-prod.env" \
            --extra_packages="$GITHUB_WORKSPACE/services.py" \
            gub_agent

      # A skipped env file leaves a healthy engine running on defaults, which
      # looks exactly like a successful deploy. Read it back and fail loudly.
      - name: Verify the env reached the engine
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          AGENT_ENGINE_ID: ${{ vars.AGENT_ENGINE_ID }}
        run: deployment/verify-engine-env.sh "$GITHUB_WORKSPACE/deploy-prod.env"

      # A fresh engine process pays a one-off cost on its first request: the
      # agent package loads there (ADK's fast_api builds the runner - and so
      # imports gub_agent - on the first request of ANY kind, :query included),
      # and with EAGER_ADK_IMPORTS=1 the package also imports what ADK would
      # otherwise import on the first model request (~2,100 modules; the first
      # request of a process used to wait 6.2-16.4 s before its first model
      # send). So the warm-up is one :query that loads the package and does
      # nothing else: list_sessions for a user that has none. It reaches no
      # model and stores no session event. It replaces a greeting turn that
      # billed a router call and, since the speculative deep path, a cancelled
      # executor round. It does not warm the first TLS connection to Vertex
      # (~0.1-0.3 s on the first real turn). Failure is non-fatal - a cold
      # first turn is slow, not broken. The same call is the 10-min ping in
      # gcp-universal-backend terraform/engine_warmup.tf.
      - name: Warm the fresh revision
        continue-on-error: true
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          AGENT_ENGINE_ID: ${{ vars.AGENT_ENGINE_ID }}
        run: |
          BASE="https://$GCP_REGION-aiplatform.googleapis.com/v1/projects/$GCP_PROJECT_ID/locations/$GCP_REGION/reasoningEngines/$AGENT_ENGINE_ID"
          TOKEN=$(gcloud auth print-access-token)
          time curl -sS -m 120 -X POST "$BASE:query" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"class_method":"list_sessions","input":{"user_id":"engine-warmup"}}' \
            -o /dev/null
          echo "engine warmed"
