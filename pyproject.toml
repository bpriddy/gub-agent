[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gub-agent"
version = "0.1.0"
description = "GUB AI Agent — ADK agent for agency operations on Vertex AI Agent Engine"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "httpx[http2]>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Required for deployment/deploy_agent_engine.py and the registration script.
# aiplatform is pinned: the SDK deploy cloudpickles the AdkApp here and
# unpickles it in the engine (deploy_agent_engine.py pins the engine's
# requirements to the versions installed at deploy time), and 1.165.1 is the
# template version verified to accept per-call run_config on stream_query
# (gub-gchat-bot#3). Bump deliberately, then re-run the cadence gate.
deploy = [
    "google-cloud-aiplatform[agent_engines]==1.165.1",
    "google-auth>=2.29.0",
    "requests>=2.31.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["gub_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
